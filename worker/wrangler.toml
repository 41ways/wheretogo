# 어디군 — 정답·거리·순위 서버 (Cloudflare Workers 무료 플랜 + D1)
#
# 정답은 이 서버만 안다. 브라우저는 고른 칸을 보내고 거리와 순위만 돌려받는다.
# 오늘 정답은 비밀값 ANSWER_SALT 로 섞은 순서에서 꺼내므로, 코드를 봐도 미리 알 수 없다.
#   npx wrangler secret put ANSWER_SALT     (한 번만. 바꾸면 그날부터 정답 순서가 통째로 바뀐다)
# 결제 수단이 없으니 무료 한도를 넘어도 요금 없이 그날 요청만 거절된다.
name = "eodigun"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[vars]
# 추측·이름 올리기(POST)를 받아줄 페이지 출처. localhost 는 코드에서 늘 허용한다.
ALLOW_ORIGINS = "https://41ways.github.io"

[[d1_databases]]
binding = "DB"
database_name = "eodigun"
database_id = "08810cfa-8986-4c12-bb1d-eb3fb0bdd610"
